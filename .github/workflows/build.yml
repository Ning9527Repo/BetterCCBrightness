name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          set -eo pipefail
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fsSL -o "$RUNNER_TEMP/sdks.zip" https://github.com/theos/sdks/archive/refs/heads/master.zip
          ditto -x -k "$RUNNER_TEMP/sdks.zip" "$RUNNER_TEMP/sdks"
          cp -R "$RUNNER_TEMP/sdks"/*.sdk "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks"

      - name: Build arm64e
        run: |
          set -eo pipefail
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 ARCHS=arm64e TARGET=iphone:clang:latest:13.0
          ls -l packages

      - name: Verify
        run: |
          set -eo pipefail
          DEB=$(ls packages/*.deb | head -1)
          echo "DEB=$DEB"
          mkdir -p "$RUNNER_TEMP/debx" && cd "$RUNNER_TEMP/debx"
          ar x "$GITHUB_WORKSPACE/$DEB"
          tar -xf control.tar.* -C . 2>/dev/null || true
          cat control 2>/dev/null || true
          mkdir -p data && tar -xf data.tar.* -C data
          find data -type f | sort
          DYLIB=$(find data -name '*.dylib' | head -1)
          xcrun lipo -info "$DYLIB"
          xcrun vtool -show-build "$DYLIB" | head -20
          xcrun codesign -dvvv "$DYLIB" 2>&1 | head -20 || true
          shasum -a 256 "$GITHUB_WORKSPACE/$DEB"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: betterccbrightness-arm64e
          path: packages/*.deb
          if-no-files-found: error
